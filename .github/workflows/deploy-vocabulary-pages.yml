name: Deploy vocabulary app to Pages

on:
  push:
    branches:
      - main
    paths:
      - kham-khoi-jam/site/**
      - .github/workflows/deploy-vocabulary-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload vocabulary app
        uses: actions/upload-pages-artifact@v3
        with:
          path: kham-khoi-jam/site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
